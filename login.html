<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema Fametro</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="top-stripe"></div>

  <main class="container app-shell">
    <header class="site-header">
      <h1>Acesso ao Sistema</h1>
      <p class="site-subtitle">Faça login para continuar</p>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <div class="nav-left">
        <!-- Sem links internos aqui, apenas modo escuro -->
      </div>
      <div class="nav-right">
        <button class="btn btn--nav" type="button" id="dark-mode-toggle">
          <span class="mode-text">Modo</span>
          <span class="mode-icon">🌙</span>
        </button>
      </div>
    </nav>

    <!-- Área de login/registro com largura aumentada e altura mínima fixa -->
    <div class="links-controls" style="max-width: 450px; margin: 0 auto; min-height: 380px;">
      <!-- Formulário de Login -->
      <form id="login-form">
        <h2>Entrar</h2>
        <div class="field">
          <span>E-mail</span>
          <input type="email" id="email" class="search-input" required>
        </div>
        <div class="field">
          <span>Senha</span>
          <input type="password" id="password" class="search-input" required>
        </div>
        <button type="submit" class="btn btn--accent" style="width:100%;">Entrar</button>
      </form>

      <p style="margin-top:1rem; text-align:center;">
        Não tem conta? <a href="#" id="show-register">Registrar</a>
      </p>

      <!-- Formulário de Registro -->
      <form id="register-form" style="display:none; margin-top:1rem;">
        <h3>Registrar</h3>
        <div class="field">
          <span>Nome</span>
          <input type="text" id="reg-nome" class="search-input" required>
        </div>
        <div class="field">
          <span>E-mail</span>
          <input type="email" id="reg-email" class="search-input" required>
        </div>
        <div class="field">
          <span>Senha</span>
          <input type="password" id="reg-password" class="search-input" required>
        </div>
        <button type="submit" class="btn btn--accent">Registrar</button>
        <p style="margin-top:0.5rem;">
          <a href="#" id="show-login">Voltar para login</a>
        </p>
      </form>

      <!-- Mensagem de erro -->
      <div id="login-message"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nawk &amp; Bentes – Todos os direitos reservados</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    // CONFIGURAÇÕES DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('Persistência LOCAL definida'))
      .catch(error => console.error('Erro na persistência:', error));

    auth.onAuthStateChanged(user => {
      if (user) {
        console.log('Usuário logado, redirecionando para portal.html');
        window.location.href = './portal.html';
      }
    });

    // Elementos do DOM
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');
    const messageDiv = document.getElementById('login-message');

    // Função para traduzir erros do Firebase
    function traduzirErroFirebase(errorCode) {
      const erros = {
        'auth/invalid-email': 'E-mail inválido.',
        'auth/user-disabled': 'Esta conta foi desativada.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-login-credentials': 'E-mail ou senha incorretos.',
        'auth/email-already-in-use': 'Este e-mail já existe',
        'auth/weak-password': 'Senha muito curta.',
        'auth/network-request-failed': 'Verifique sua internet.',
        'auth/too-many-requests': 'Muitas tentativas.',
        'auth/popup-closed-by-user': 'Login cancelado.',
        'auth/cancelled-popup-request': 'Operação cancelada.',
        'auth/internal-error': 'Erro interno. Tente novamente.'
      };
      return erros[errorCode] || `Erro desconhecido: ${errorCode}`;
    }

    // Alternar entre formulários
    showRegister.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      messageDiv.textContent = '';
      messageDiv.style.display = 'none';
    });

    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
      messageDiv.textContent = '';
      messageDiv.style.display = 'none';
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log('Formulário de login submetido');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      messageDiv.textContent = '';
      messageDiv.style.display = 'none';

      try {
        console.log('Tentando login com:', email);
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        console.log('Erro no login:', error.code);
        const mensagem = traduzirErroFirebase(error.code);
        messageDiv.textContent = mensagem;
        messageDiv.style.display = 'flex';
      }
    });

    // Registro
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log('Formulário de registro submetido');

      const nome = document.getElementById('reg-nome').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      
      messageDiv.textContent = '';
      messageDiv.style.display = 'none';

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({
          nome,
          email,
          tipo: 'comum',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log('Registro bem-sucedido');
      } catch (error) {
        console.log('Erro no registro:', error.code);
        const mensagem = traduzirErroFirebase(error.code);
        messageDiv.textContent = mensagem;
        messageDiv.style.display = 'flex';
      }
    });

    // Logout (caso necessário em outras páginas)
    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      });
    };
  </script>
  <script src="./assets/js/dark-mode.js"></script>
</body>
</html>
