<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Inscrições - Fametro 2026/1</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="top-stripe" aria-hidden="true"></div>

  <main class="container app-shell">
    <header class="site-header">
      <h1>Portal de Inscrições — Fametro 2026/1</h1>
      <p class="site-subtitle">Acesso rápido por unidade e modalidade</p>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <div class="nav-left">
        <a class="btn btn--nav is-active" href="./portal.html" aria-current="page">Portal</a>
        <a class="btn btn--nav" href="./links.html">Central de Links</a>
        <button class="btn btn--nav" type="button" data-action="open-global-search">Pesquisar cursos</button>
        <button class="btn btn--nav" type="button" data-action="open-prices-menu">Pesquisar preços</button>
        <!-- Links de autenticação (inicialmente ocultos) -->
        <a class="btn btn--nav" href="./tickets.html" id="tickets-link" style="display:none;">Tickets <span id="tickets-badge" class="badge">0</span></a>
        <button class="btn btn--nav" id="logout-btn" onclick="logout()" style="display:none;">Sair</button>
      </div>
      <div class="nav-right">
        <button class="btn btn--nav" type="button" id="dark-mode-toggle">
          <span class="mode-text">Modo</span>
          <span class="mode-icon">🌙</span>
        </button>
      </div>
    </nav>

    <div id="app" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nawk &amp; Bentes – Todos os direitos reservados</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Persistência LOCAL
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('✅ Persistência LOCAL definida em portal'))
      .catch(error => console.error('❌ Erro na persistência:', error));

    // Variável para armazenar o usuário atual
    let currentUser = null;

    auth.onAuthStateChanged(async (user) => {
      console.log('🔍 portal: onAuthStateChanged', user ? `Usuário: ${user.email}` : 'Nenhum usuário');
      if (!user) {
        window.location.href = './index.html';
        return;
      }

      // Buscar dados do usuário no Firestore
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          currentUser = { uid: user.uid, ...doc.data() };
        } else {
          // Se não existir, criar perfil padrão (improvável)
          const newUser = {
            email: user.email,
            nome: user.displayName || 'Usuário',
            tipo: 'comum',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('users').doc(user.uid).set(newUser);
          currentUser = { uid: user.uid, ...newUser };
        }

        // Mostrar links de tickets e logout
        const ticketsLink = document.getElementById('tickets-link');
        const logoutBtn = document.getElementById('logout-btn');
        if (ticketsLink) ticketsLink.style.display = 'inline-block';
        if (logoutBtn) logoutBtn.style.display = 'inline-block';

        // Atualizar badge de tickets
        atualizarBadge();
      } catch (error) {
        console.error('Erro ao carregar perfil:', error);
        window.location.href = './index.html';
      }
    });

    // Função para atualizar o badge com a contagem de tickets abertos
    async function atualizarBadge() {
      if (!currentUser) return;
      const badge = document.getElementById('tickets-badge');
      if (!badge) return;

      let query = db.collection('tickets').where('status', '==', 'aberto');
      if (currentUser.tipo === 'comum') {
        query = query.where('criadoPor', '==', currentUser.uid);
      }

      try {
        const snapshot = await query.get();
        const count = snapshot.size;
        badge.textContent = count;
        badge.style.display = count === 0 ? 'none' : 'inline-block';
      } catch (error) {
        console.error('Erro ao buscar tickets:', error);
      }
    }

    // Função de logout
    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      }).catch(error => {
        console.error('Erro no logout:', error);
      });
    };
  </script>

  <!-- Scripts do projeto (remova auth.js se não for mais necessário) -->
  <!-- <script defer src="./assets/js/auth.js"></script> -->
  <script defer src="./assets/data/links-data.js"></script>
  <script defer src="./assets/data/courses-data.js"></script>
  <script defer src="./assets/data/course_prices_2026_1_data.js"></script>
  <script defer src="./assets/js/legacy.js"></script>
  <script defer src="./assets/js/dark-mode.js"></script>
  <script defer src="./assets/js/modals-shared.js"></script>
  <script defer src="./assets/js/app.js"></script>
</body>
</html>
