<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Links - Fametro 2026/1</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="top-stripe" aria-hidden="true"></div>

  <main class="container app-shell">
    <header class="site-header">
      <h1>Central de Links — Fametro 2026/1</h1>
      <p class="site-subtitle">Busca rápida por unidade, modalidade e tipo</p>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <div class="nav-left">
        <a class="btn btn--nav" href="./portal.html">Portal</a>
        <a class="btn btn--nav is-active" href="./links.html" aria-current="page">Central de Links</a>
        <button class="btn btn--nav" type="button" data-action="open-global-search">Pesquisar cursos</button>
        <button class="btn btn--nav" type="button" data-action="open-prices-menu">Pesquisar preços</button>
        <!-- Links de autenticação com dois badges -->
        <a class="btn btn--nav" href="./tickets.html" id="tickets-link" style="display:none;">
          Tickets 
          <span id="tickets-badge" class="badge" style="background-color:#dc2626;">0</span>
          <span id="tickets-andamento-badge" class="badge" style="background-color:#f59e0b; margin-left:0.2rem;">0</span>
        </a>
        <button class="btn btn--nav" id="logout-btn" onclick="logout()" style="display:none;">Sair</button>
      </div>
      <div class="nav-right">
        <button class="btn btn--nav" type="button" id="dark-mode-toggle">
          <span class="mode-text">Modo</span>
          <span class="mode-icon">🌙</span>
        </button>
      </div>
    </nav>

    <!-- Filtros -->
    <div class="links-controls">
      <div class="links-controls-grid">
        <div class="field">
          <span>Unidade</span>
          <select id="filter-unit"></select>
        </div>
        <div class="field">
          <span>Modalidade</span>
          <select id="filter-modality"></select>
        </div>
        <div class="field">
          <span>Ingresso</span>
          <select id="filter-type"></select>
        </div>
        <div class="field">
          <span>Buscar...</span>
          <input type="search" id="filter-query" class="search-input" placeholder="Palavra-chave..." />
        </div>
      </div>
      <div class="links-meta" id="links-meta"></div>
      <button class="btn" type="button" data-action="reset-filters">Limpar filtros</button>
    </div>

    <div id="links-groups" class="links-groups"></div>
    <div id="links-empty" class="empty" hidden>Nenhum link encontrado.</div>
    <div class="load-more-wrapper">
      <button id="links-load-more" class="btn" type="button" data-action="load-more" hidden>Carregar mais</button>
    </div>

    <section class="links-qa">
      <h2>🔍 Controle de qualidade (QA)</h2>
      <ul id="qa-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nawk &amp; Bentes – Todos os direitos reservados</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('✅ Persistência LOCAL definida em links'))
      .catch(error => console.error('❌ Erro na persistência:', error));

    let currentUser = null;

    auth.onAuthStateChanged(async (user) => {
      console.log('🔍 links: onAuthStateChanged', user ? `Usuário: ${user.email}` : 'Nenhum usuário');
      if (!user) {
        window.location.href = './index.html';
        return;
      }

      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          currentUser = { uid: user.uid, ...doc.data() };
        } else {
          const newUser = {
            email: user.email,
            nome: user.displayName || 'Usuário',
            tipo: 'comum',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('users').doc(user.uid).set(newUser);
          currentUser = { uid: user.uid, ...newUser };
        }

        const ticketsLink = document.getElementById('tickets-link');
        const logoutBtn = document.getElementById('logout-btn');
        if (ticketsLink) ticketsLink.style.display = 'inline-block';
        if (logoutBtn) logoutBtn.style.display = 'inline-block';

        atualizarBadges();
      } catch (error) {
        console.error('Erro ao carregar perfil:', error);
        window.location.href = './index.html';
      }
    });

    async function atualizarBadges() {
      if (!currentUser) return;
      const badgeAbertos = document.getElementById('tickets-badge');
      const badgeAndamento = document.getElementById('tickets-andamento-badge');
      if (!badgeAbertos || !badgeAndamento) return;

      let queryAbertos = db.collection('tickets').where('status', '==', 'aberto');
      let queryAndamento = db.collection('tickets').where('status', '==', 'em_andamento');
      
      if (currentUser.tipo === 'comum') {
        queryAbertos = queryAbertos.where('criadoPor', '==', currentUser.uid);
        queryAndamento = queryAndamento.where('criadoPor', '==', currentUser.uid);
      }

      try {
        const [snapAbertos, snapAndamento] = await Promise.all([queryAbertos.get(), queryAndamento.get()]);
        badgeAbertos.textContent = snapAbertos.size;
        badgeAbertos.style.display = snapAbertos.size === 0 ? 'none' : 'inline-block';
        badgeAndamento.textContent = snapAndamento.size;
        badgeAndamento.style.display = snapAndamento.size === 0 ? 'none' : 'inline-block';
      } catch (error) {
        console.error('Erro ao atualizar badges:', error);
      }
    }

    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      }).catch(error => {
        console.error('Erro no logout:', error);
      });
    };
  </script>

  <!-- Scripts existentes -->
  <script defer src="./assets/data/links-data.js"></script>
  <script defer src="./assets/data/courses-data.js"></script>
  <script defer src="./assets/data/course_prices_2026_1_data.js"></script>
  <script defer src="./assets/js/legacy.js"></script>
  <script defer src="./assets/js/dark-mode.js"></script>
  <script defer src="./assets/js/links-page.js"></script>
  <script defer src="./assets/js/app.js"></script>
  <script src="./assets/js/notificacoes.js"></script>
</body>
</html>
