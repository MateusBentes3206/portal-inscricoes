<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets - Sistema de Suporte</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="top-stripe" aria-hidden="true"></div>

  <main class="container app-shell">
    <header class="site-header">
      <h1>Sistema de Tickets</h1>
      <p class="site-subtitle">Acompanhe e gerencie solicitações</p>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <div class="nav-left">
        <a class="btn btn--nav" href="./portal.html">Portal</a>
        <a class="btn btn--nav" href="./links.html">Central de Links</a>
        <a class="btn btn--nav is-active" href="./tickets.html">Tickets <span id="tickets-badge" class="badge">0</span></a>
        <button class="btn btn--nav" id="logout-btn" onclick="logout()" style="display:none;">Sair</button>
      </div>
      <div class="nav-right">
        <button class="btn btn--nav" type="button" id="dark-mode-toggle">
          <span class="mode-text">Modo</span>
          <span class="mode-icon">🌙</span>
        </button>
      </div>
    </nav>

    <!-- Controles -->
    <div class="links-controls">
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <button class="btn btn--accent" id="new-ticket-btn">Novo Ticket</button>
        <div style="display: flex; gap: 0.5rem;">
          <button class="tab is-active" data-status="aberto">Abertos</button>
          <button class="tab" data-status="concluido">Concluídos</button>
        </div>
      </div>
    </div>

    <!-- Lista de tickets -->
    <div id="tickets-list" class="links-groups"></div>
    <div id="tickets-empty" class="empty" hidden>Nenhum ticket encontrado.</div>

    <!-- Modal para criar/editar ticket -->
    <div id="ticket-modal" class="modal-overlay" style="display:none;">
      <div class="modal" style="max-width:500px;">
        <div class="modal-head">
          <div class="modal-title" id="modal-title">Novo Ticket</div>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="ticket-form">
            <input type="hidden" id="ticket-id">
            <div class="field">
              <span>CPF do Aluno</span>
              <input type="text" id="cpf-aluno" class="search-input" required placeholder="000.000.000-00">
            </div>
            <div class="field">
              <span>Unidade</span>
              <select id="unidade" class="search-input" required>
                <option value="">Selecione...</option>
                <option value="SEDE">SEDE</option>
                <option value="LESTE">LESTE</option>
                <option value="SUL">SUL</option>
                <option value="NORTE">NORTE</option>
                <option value="OESTE">OESTE</option>
              </select>
            </div>
            <div class="field">
              <span>Modalidade</span>
              <select id="modalidade" class="search-input" required>
                <option value="">Selecione...</option>
                <option value="Presencial">Presencial</option>
                <option value="Híbrido">Híbrido</option>
                <option value="Semipresencial">Semipresencial</option>
                <option value="EAD">EAD</option>
              </select>
            </div>
            <div class="field">
              <span>Problema</span>
              <textarea id="problema" class="search-input" rows="4" required placeholder="Descreva o problema..."></textarea>
            </div>
            <div class="field" id="resolucao-field" style="display:none;">
              <span>Mensagem de Resolução</span>
              <textarea id="resolucao" class="search-input" rows="3"></textarea>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top:1rem;">
              <button type="submit" class="btn btn--accent" id="save-ticket">Salvar</button>
              <button type="button" class="btn" id="cancel-modal">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nawk &amp; Bentes – Todos os direitos reservados</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    // CONFIGURAÇÕES DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // PERSISTÊNCIA LOCAL
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('✅ Persistência LOCAL definida em tickets'))
      .catch(error => console.error('❌ Erro na persistência:', error));

    let currentUser = null;
    let currentStatus = 'aberto';
    let authResolved = false;
    let redirectTimeout = null;

    // Listener de autenticação
    auth.onAuthStateChanged(async (user) => {
      console.log('🔍 tickets: onAuthStateChanged', user ? `Usuário: ${user.email}` : 'Nenhum usuário');

      if (authResolved) return;

      if (user) {
        if (redirectTimeout) {
          clearTimeout(redirectTimeout);
          redirectTimeout = null;
        }
        authResolved = true;

        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (doc.exists) {
            currentUser = { uid: user.uid, ...doc.data() };
          } else {
            const newUser = {
              email: user.email,
              nome: user.displayName || 'Usuário',
              tipo: 'comum',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(user.uid).set(newUser);
            currentUser = { uid: user.uid, ...newUser };
          }
          console.log('Usuário carregado:', currentUser);
          carregarTickets();
          updateMenu();
        } catch (error) {
          console.error('Erro ao carregar perfil:', error);
          window.location.href = './index.html';
        }
      } else {
        if (!redirectTimeout) {
          redirectTimeout = setTimeout(() => {
            if (!authResolved) {
              console.log('tickets: timeout – nenhum usuário, redirecionando para login');
              authResolved = true;
              window.location.href = './index.html';
            }
          }, 500);
        }
      }
    });

    // Atualizar menu (mostrar botão sair)
    function updateMenu() {
      const logoutBtn = document.getElementById('logout-btn');
      if (currentUser) {
        if (logoutBtn) logoutBtn.style.display = 'inline-block';
      } else {
        if (logoutBtn) logoutBtn.style.display = 'none';
      }
    }

    // Carregar tickets conforme status e tipo
    function carregarTickets() {
      if (!currentUser) {
        console.log('carregarTickets: currentUser não definido');
        return;
      }
      console.log('Carregando tickets para status:', currentStatus, 'usuário:', currentUser.uid, 'tipo:', currentUser.tipo);

      // Primeiro, buscar todos os tickets para ver se há documentos (sem filtro)
      db.collection('tickets').get().then(snapshotAll => {
        console.log('Total de tickets na coleção (sem filtro):', snapshotAll.size);
        snapshotAll.forEach(doc => console.log('Ticket bruto:', doc.id, doc.data()));
        
        // Agora aplica a query com filtros
        let query = db.collection('tickets').where('status', '==', currentStatus);
        if (currentUser.tipo === 'comum') {
          query = query.where('criadoPor', '==', currentUser.uid);
        }
        query.orderBy('criadoEm', 'desc').get()
          .then(snapshot => {
            console.log('Tickets encontrados com filtro:', snapshot.size);
            const tickets = [];
            snapshot.forEach(doc => {
              console.log('Ticket filtrado:', doc.id, doc.data());
              tickets.push({ id: doc.id, ...doc.data() });
            });
            renderTickets(tickets);
            atualizarBadge(tickets);
          })
          .catch(error => {
            console.error('Erro na query filtrada:', error);
            if (error.code === 'failed-precondition') {
              alert('Ainda há problemas com o índice. Verifique o console para mais detalhes.');
            }
          });
      }).catch(error => {
        console.error('Erro ao buscar todos os tickets:', error);
      });
    }

    // Atualizar badge com contagem de abertos
    function atualizarBadge(tickets) {
      const badge = document.getElementById('tickets-badge');
      if (badge) {
        let count = tickets.filter(t => t.status === 'aberto').length;
        badge.textContent = count;
        badge.style.display = count === 0 ? 'none' : 'inline-block';
      }
    }

    // Renderizar lista de tickets
    function renderTickets(tickets) {
      const container = document.getElementById('tickets-list');
      const empty = document.getElementById('tickets-empty');
      container.innerHTML = '';
      if (tickets.length === 0) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      tickets.forEach(t => {
        const card = document.createElement('article');
        card.className = 'unit-block';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 class="unit-group__title" style="margin-bottom:0;">Ticket #${t.id.slice(0,6)}</h3>
            <span class="badge" style="background:${t.status === 'aberto' ? '#dc2626' : '#10b981'}">${t.status}</span>
          </div>
          <p><strong>CPF:</strong> ${t.cpfAluno} | <strong>Unidade:</strong> ${t.unidade} | <strong>Modalidade:</strong> ${t.modalidade}</p>
          <p><strong>Criado por:</strong> ${t.nomeCriador || 'Desconhecido'}</p>
          <p><strong>Problema:</strong> ${t.problema}</p>
          ${t.resolucao ? `<p><strong>Resolução:</strong> ${t.resolucao}</p>` : ''}
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
            <button class="btn" onclick="verTicket('${t.id}')">Ver detalhes</button>
            ${(currentUser.tipo !== 'comum' && t.status === 'aberto') ? `<button class="btn btn--accent" onclick="concluirTicket('${t.id}')">Concluir</button>` : ''}
            ${(currentUser.tipo !== 'comum' && t.status === 'concluido') ? `<button class="btn" onclick="reabrirTicket('${t.id}')">Reabrir</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Função para habilitar/desabilitar campos do modal conforme permissão
    function setModalFieldsState(editable) {
      const fields = ['cpf-aluno', 'unidade', 'modalidade', 'problema', 'resolucao'];
      fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = !editable;
      });
      document.getElementById('save-ticket').style.display = editable ? 'inline-block' : 'none';
    }

    // Abrir modal para novo ticket
    document.getElementById('new-ticket-btn').addEventListener('click', () => {
      document.getElementById('ticket-id').value = '';
      document.getElementById('cpf-aluno').value = '';
      document.getElementById('unidade').value = '';
      document.getElementById('modalidade').value = '';
      document.getElementById('problema').value = '';
      document.getElementById('resolucao').value = '';
      document.getElementById('resolucao-field').style.display = 'none';
      document.getElementById('modal-title').textContent = 'Novo Ticket';
      // No novo ticket, todos os campos são editáveis (para qualquer usuário)
      setModalFieldsState(true);
      document.getElementById('ticket-modal').style.display = 'flex';
    });

    // Ver detalhes de um ticket existente
    window.verTicket = async (id) => {
      try {
        const doc = await db.collection('tickets').doc(id).get();
        if (!doc.exists) return;
        const t = doc.data();
        document.getElementById('ticket-id').value = id;
        document.getElementById('cpf-aluno').value = t.cpfAluno;
        document.getElementById('unidade').value = t.unidade;
        document.getElementById('modalidade').value = t.modalidade;
        document.getElementById('problema').value = t.problema;
        document.getElementById('resolucao').value = t.resolucao || '';

        const isAdmin = currentUser.tipo !== 'comum';
        if (isAdmin) {
          // Admin pode ver e editar resolução
          document.getElementById('resolucao-field').style.display = 'block';
          document.getElementById('modal-title').textContent = 'Detalhes do Ticket (Admin)';
          setModalFieldsState(true); // Admin pode editar
        } else {
          // Usuário comum: apenas visualização
          document.getElementById('resolucao-field').style.display = 'none';
          document.getElementById('modal-title').textContent = 'Detalhes do Ticket';
          setModalFieldsState(false); // Desabilita todos os campos
        }
        document.getElementById('ticket-modal').style.display = 'flex';
      } catch (error) {
        console.error('Erro ao carregar ticket:', error);
      }
    };

    // Salvar ticket (criar ou concluir)
    document.getElementById('ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('ticket-id').value;
      const cpf = document.getElementById('cpf-aluno').value;
      const unidade = document.getElementById('unidade').value;
      const modalidade = document.getElementById('modalidade').value;
      const problema = document.getElementById('problema').value;
      const resolucao = document.getElementById('resolucao').value;

      // Se for um ticket existente (id presente), apenas admin pode concluir
      if (id) {
        if (currentUser.tipo === 'comum') {
          alert('Você não tem permissão para concluir tickets.');
          return;
        }
        try {
          await db.collection('tickets').doc(id).update({
            status: 'concluido',
            resolucao: resolucao,
            concluidoPor: currentUser.uid,
            concluidoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
          console.log('Ticket concluído:', id);
          fecharModal();
          carregarTickets();
        } catch (error) {
          console.error('Erro ao concluir ticket:', error);
          alert('Erro ao concluir: ' + error.message);
        }
      } else {
        // Criação de novo ticket (qualquer um pode)
        try {
          const novo = {
            cpfAluno: cpf,
            unidade: unidade,
            modalidade: modalidade,
            problema: problema,
            status: 'aberto',
            criadoPor: currentUser.uid,
            nomeCriador: currentUser.nome || 'Usuário',
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('tickets').add(novo);
          console.log('Ticket criado:', novo);
          fecharModal();
          carregarTickets();
        } catch (error) {
          console.error('Erro ao criar ticket:', error);
          alert('Erro ao criar: ' + error.message);
        }
      }
    });

    // Função para concluir ticket via botão na lista (apenas admin)
    window.concluirTicket = (id) => {
      const resolucao = prompt('Mensagem de resolução:');
      if (resolucao) {
        db.collection('tickets').doc(id).update({
          status: 'concluido',
          resolucao,
          concluidoPor: currentUser.uid,
          concluidoEm: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          console.log('Ticket concluído:', id);
          carregarTickets();
        }).catch(error => {
          console.error('Erro ao concluir ticket:', error);
          alert('Erro ao concluir: ' + error.message);
        });
      }
    };

    window.reabrirTicket = (id) => {
      if (confirm('Reabrir este ticket?')) {
        db.collection('tickets').doc(id).update({
          status: 'aberto',
          resolucao: '',
          reabertoPor: currentUser.uid,
          reabertoEm: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          console.log('Ticket reaberto:', id);
          carregarTickets();
        }).catch(error => {
          console.error('Erro ao reabrir ticket:', error);
          alert('Erro ao reabrir: ' + error.message);
        });
      }
    };

    function fecharModal() {
      document.getElementById('ticket-modal').style.display = 'none';
    }

    document.getElementById('modal-close').addEventListener('click', fecharModal);
    document.getElementById('cancel-modal').addEventListener('click', fecharModal);

    // Trocar abas
    document.querySelectorAll('.tab[data-status]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('is-active'));
        tab.classList.add('is-active');
        currentStatus = tab.dataset.status;
        carregarTickets();
      });
    });

    // Função de logout
    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      }).catch(error => {
        console.error('Erro no logout:', error);
      });
    };
  </script>

  <script src="./assets/js/dark-mode.js"></script>
</body>
</html>
